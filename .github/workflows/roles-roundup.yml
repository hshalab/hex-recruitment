name: Roles roundup email

# Weekly "roles for you this week" email to candidates.
#
# WHY A GITHUB ACTION RATHER THAN A VERCEL CRON
# Vercel triggers cron jobs with an HTTP GET, and this route's GET handler is
# deliberately status-only — it never sends, so that no stray browser request or
# crawler can mail fifteen people. A Vercel cron pointed at it would return a
# tidy 200 with sent: 0 every Tuesday and quietly deliver nothing.
#
# Rather than remove that safety rail, the trigger moved here. It also buys the
# observability we found we were missing: Actions keeps a visible run history
# and emails on failure, where a Vercel cron returning 200 over a failed send
# told nobody anything.
#
# Same mechanism as the Goldenkeys import, deliberately: scrape at 06:00 and
# roundup at 08:00 on the same Tuesday is now one pairing on one system, not two
# schedules that happen to line up.
#
# Requires repo secrets: SITE_URL, CRON_SECRET

on:
  # SCHEDULE DELIBERATELY COMMENTED OUT. Nothing runs unattended until a manual
  # workflow_dispatch has been watched end to end. To enable, uncomment and keep
  # it two hours after the Goldenkeys scrape (0 6 * * 2) so the email goes out
  # against a board refreshed that morning.
  #
  # schedule:
  #   - cron: '0 8 * * 2'   # Tuesdays 08:00 UTC

  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (no email), test (one address), send (all recipients)'
        type: choice
        required: true
        default: dry-run
        options: [dry-run, test, send]
      testTo:
        description: 'Address for test mode. Ignored otherwise.'
        type: string
        required: false
        default: 'pauldavies.gbr@gmail.com'
      confirm:
        description: 'Type SEND to confirm a real send to every recipient. Required for mode=send.'
        type: string
        required: false
        default: ''

concurrency:
  group: roles-roundup
  cancel-in-progress: false

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse a real send without confirmation
        if: inputs.mode == 'send' && inputs.confirm != 'SEND'
        run: |
          echo "::error::mode=send requires confirm=SEND. Refusing to mail real candidates."
          exit 1

      - name: Trigger the roundup
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          TEST_TO: ${{ inputs.testTo }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::SITE_URL and CRON_SECRET repo secrets must both be set."
            exit 1
          fi

          payload=$(MODE="$MODE" TEST_TO="$TEST_TO" CONFIRM="$CONFIRM" python3 -c '
          import json, os
          mode = os.environ["MODE"]
          body = {"mode": mode}
          if mode == "test":
              body["testTo"] = os.environ["TEST_TO"]
          if mode == "send":
              body["confirm"] = os.environ["CONFIRM"]
          print(json.dumps(body))
          ')

          echo "POST ${SITE_URL}/api/cron/roles-roundup  mode=${MODE}"

          # -o/-w rather than --fail: we want the BODY on a failure, because the
          # route returns the per-recipient failed[] list alongside the 500.
          status=$(curl -sS -X POST "${SITE_URL}/api/cron/roles-roundup" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d "$payload" \
            -o response.json -w '%{http_code}')

          echo "HTTP ${status}"
          python3 -m json.tool response.json || cat response.json

          # A failed send must fail the RUN. This is the whole point of moving
          # the trigger here: the route now returns 500 when any send fails, and
          # Actions turns that into a red run and a notification email. A green
          # tick must mean the emails actually went.
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Roundup returned HTTP ${status} — see the response body above."
            exit 1
          fi

          sent=$(python3 -c "import json;print(json.load(open('response.json')).get('sent',0))")
          echo "::notice::Roundup ${MODE} completed — sent=${sent}"
