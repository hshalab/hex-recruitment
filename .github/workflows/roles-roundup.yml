name: Roles roundup email

# Weekly "roles for you this week" email to candidates.
#
# WHY A GITHUB ACTION RATHER THAN A VERCEL CRON
# Vercel triggers cron jobs with an HTTP GET, and this route's GET handler is
# deliberately status-only — it never sends, so that no stray browser request or
# crawler can mail fifteen people. A Vercel cron pointed at it would return a
# tidy 200 with sent: 0 every Tuesday and quietly deliver nothing.
#
# Rather than remove that safety rail, the trigger moved here. It also buys the
# observability we found we were missing: Actions keeps a visible run history
# and emails on failure, where a Vercel cron returning 200 over a failed send
# told nobody anything.
#
# Same mechanism as the Goldenkeys import, deliberately: scrape at 06:00 and
# roundup at 08:00 on the same Tuesday is now one pairing on one system, not two
# schedules that happen to line up.
#
# Requires repo secrets: SITE_URL, CRON_SECRET

on:
  # SCHEDULE DELIBERATELY COMMENTED OUT. Nothing runs unattended until a manual
  # workflow_dispatch has been watched end to end. To enable, uncomment and keep
  # it two hours after the Goldenkeys scrape (0 6 * * 2) so the email goes out
  # against a board refreshed that morning.
  #
  # schedule:
  #   - cron: '0 8 * * 2'   # Tuesdays 08:00 UTC

  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (no email), test (one address), send (all recipients)'
        type: choice
        required: true
        default: dry-run
        options: [dry-run, test, send]
      testTo:
        description: 'Address for test mode. Ignored otherwise.'
        type: string
        required: false
        default: 'pauldavies.gbr@gmail.com'
      confirm:
        description: 'Type SEND to confirm a real send to every recipient. Required for mode=send.'
        type: string
        required: false
        default: ''

concurrency:
  group: roles-roundup
  cancel-in-progress: false

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ONE STEP, ONE RESOLUTION, ONE READ.
      #
      # The confirmation used to live in a separate step whose `if:` read
      # `inputs.confirm` directly, while the request body read a CONFIRM env var
      # built from `${{ github.event_name == 'schedule' && 'SEND' || inputs.confirm }}`.
      # On run #4 the guard step SKIPPED — so it saw confirm=SEND — and the POST
      # still arrived without it, and the route rightly refused. Two reads of the
      # same intention that could disagree, and did.
      #
      # I could not reproduce which of the two was wrong by reading the file, so
      # rather than guess I removed the difference: the inputs are passed in raw,
      # resolved ONCE in shell, and the same two variables are used by both the
      # refusal check and the payload. There is no longer a second value to be
      # out of step with the first.
      - name: Trigger the roundup
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Raw inputs only — no expression logic in YAML. On a schedule these
          # arrive empty, which is correct and handled below: workflow_dispatch
          # defaults are applied by GitHub only for a workflow_dispatch event, so
          # `inputs.mode` on a schedule is '' and NOT 'dry-run'.
          EVENT_NAME: ${{ github.event_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_TEST_TO: ${{ inputs.testTo }}
          IN_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::SITE_URL and CRON_SECRET repo secrets must both be set."
            exit 1
          fi

          # A schedule carries no inputs, so it decides for itself: a real send,
          # with the confirmation the route requires. Anything manual uses what
          # was typed, defaulting to dry-run.
          #
          # This does mean the confirmation token stops protecting the SCHEDULED
          # path. What protects it instead:
          #   1. the schedule block above is COMMENTED OUT — enabling it is a
          #      deliberate act by a person editing this file
          #   2. isDue() gives each candidate a 7-day cadence, so even a schedule
          #      misconfigured to fire hourly cannot mail anyone twice in a week
          #   3. CRON_SECRET is still required to reach the send path at all
          #   4. the manual path still needs BOTH keys
          if [ "$EVENT_NAME" = "schedule" ]; then
            MODE="send"
            CONFIRM="SEND"
          else
            MODE="${IN_MODE:-dry-run}"
            CONFIRM="${IN_CONFIRM:-}"
          fi

          # Say what we hold BEFORE acting on it. Debugging the last failure blind
          # cost a run; the confirmation is reported as present/absent rather than
          # echoed, since it is a shared token.
          if [ "$CONFIRM" = "SEND" ]; then confirm_state="present and correct"; else confirm_state="absent or wrong"; fi
          echo "event=${EVENT_NAME}  resolved mode=${MODE}  confirm: ${confirm_state}"

          # The refusal now reads the SAME variable the payload will use.
          if [ "$MODE" = "send" ] && [ "$CONFIRM" != "SEND" ]; then
            echo "::error::mode=send requires confirm=SEND. Refusing to mail real candidates."
            exit 1
          fi

          # Fail on an unresolved mode rather than falling through to something
          # harmless-looking. An empty MODE used to become {"mode": ""}, which
          # the route reads as dry-run — a green run that sends nothing.
          case "$MODE" in
            dry-run) payload='{"mode":"dry-run"}' ;;
            test)    payload="{\"mode\":\"test\",\"testTo\":\"${IN_TEST_TO}\"}" ;;
            send)    payload="{\"mode\":\"send\",\"confirm\":\"${CONFIRM}\"}" ;;
            *)
              echo "::error::MODE resolved to '${MODE}', which is not dry-run, test or send. Refusing to guess."
              exit 1
              ;;
          esac

          # Prove the body carries what we think, without printing the token.
          echo "payload keys: $(echo "$payload" | tr -d '{}\"' | tr ',' '\n' | cut -d: -f1 | tr '\n' ' ')"
          echo "POST ${SITE_URL}/api/cron/roles-roundup"

          # -o/-w rather than --fail: we want the BODY on a failure, because the
          # route returns the per-recipient failed[] list alongside the 500.
          status=$(curl -sS -X POST "${SITE_URL}/api/cron/roles-roundup" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d "$payload" \
            -o response.json -w '%{http_code}')

          echo "HTTP ${status}"
          python3 -m json.tool response.json || cat response.json

          # A failed send must fail the RUN. This is the whole point of moving
          # the trigger here: the route now returns 500 when any send fails, and
          # Actions turns that into a red run and a notification email. A green
          # tick must mean the emails actually went.
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Roundup returned HTTP ${status} — see the response body above."
            exit 1
          fi

          sent=$(python3 -c "import json;print(json.load(open('response.json')).get('sent',0))")
          echo "::notice::Roundup ${MODE} completed — sent=${sent}"
