name: Roles roundup email

# Weekly "roles for you this week" email to candidates.
#
# WHY A GITHUB ACTION RATHER THAN A VERCEL CRON
# Vercel triggers cron jobs with an HTTP GET, and this route's GET handler is
# deliberately status-only — it never sends, so that no stray browser request or
# crawler can mail fifteen people. A Vercel cron pointed at it would return a
# tidy 200 with sent: 0 every Tuesday and quietly deliver nothing.
#
# Rather than remove that safety rail, the trigger moved here. It also buys the
# observability we found we were missing: Actions keeps a visible run history
# and emails on failure, where a Vercel cron returning 200 over a failed send
# told nobody anything.
#
# Same mechanism as the Goldenkeys import, deliberately: scrape at 06:00 and
# roundup at 08:00 on the same Tuesday is now one pairing on one system, not two
# schedules that happen to line up.
#
# Requires repo secrets: SITE_URL, CRON_SECRET

on:
  # SCHEDULE DELIBERATELY COMMENTED OUT. Nothing runs unattended until a manual
  # workflow_dispatch has been watched end to end. To enable, uncomment and keep
  # it two hours after the Goldenkeys scrape (0 6 * * 2) so the email goes out
  # against a board refreshed that morning.
  #
  # schedule:
  #   - cron: '0 8 * * 2'   # Tuesdays 08:00 UTC

  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (no email), test (one address), send (all recipients)'
        type: choice
        required: true
        default: dry-run
        options: [dry-run, test, send]
      testTo:
        description: 'Address for test mode. Ignored otherwise.'
        type: string
        required: false
        default: 'pauldavies.gbr@gmail.com'
      confirm:
        description: 'Type SEND to confirm a real send to every recipient. Required for mode=send.'
        type: string
        required: false
        default: ''

concurrency:
  group: roles-roundup
  cancel-in-progress: false

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Manual runs only. A scheduled run has no inputs to type a confirmation
      # into, so this guard cannot apply to it — see the note on CONFIRM below
      # for what protects the scheduled path instead.
      - name: Refuse a real send without confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'send' && inputs.confirm != 'SEND'
        run: |
          echo "::error::mode=send requires confirm=SEND. Refusing to mail real candidates."
          exit 1

      - name: Trigger the roundup
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # THE INPUTS CONTEXT IS EMPTY ON A SCHEDULE.
          #
          # workflow_dispatch defaults are applied by GitHub only for a
          # workflow_dispatch event. On a schedule there are no inputs at all,
          # so `inputs.mode` evaluates to an empty string — NOT to 'dry-run'.
          # Left as it was, a Tuesday run would have POSTed {"mode": ""}, the
          # route would have read that as dry-run, returned 200 with sent: 0,
          # and the workflow would have gone green having emailed nobody. That
          # is the Vercel-GET failure in a different hat: a scheduled job that
          # looks healthy and does nothing.
          #
          # So the mode is decided by the EVENT, not by an input that isn't
          # there. Schedule means a real send; anything manual keeps the
          # dry-run default and has to be asked for explicitly.
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          TEST_TO: ${{ inputs.testTo }}
          # The route requires confirm:'SEND' alongside mode=send. A schedule
          # cannot type it, so it is supplied here — which does mean the token
          # stops protecting the scheduled path, and I would rather say that
          # than have it look like a guard when it isn't.
          #
          # What protects a scheduled send instead:
          #   1. the schedule block above is COMMENTED OUT, so enabling it is a
          #      deliberate act by a person editing this file
          #   2. isDue() gives each candidate a 7-day cadence, so even a
          #      misconfigured schedule firing hourly mails nobody twice in a
          #      week — the blast radius of a mistake is one email per person
          #   3. CRON_SECRET is still required, so nothing but this workflow can
          #      reach the send path
          #   4. the manual path keeps BOTH keys: mode=send AND confirm=SEND
          CONFIRM: ${{ github.event_name == 'schedule' && 'SEND' || inputs.confirm }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::SITE_URL and CRON_SECRET repo secrets must both be set."
            exit 1
          fi

          # Fail on an unresolved mode rather than falling through to something
          # harmless-looking. An empty MODE used to become {"mode": ""}, which
          # the route reads as dry-run — a green run that sends nothing. If this
          # is ever empty again, it should stop here and say so.
          case "$MODE" in
            dry-run) payload='{"mode":"dry-run"}' ;;
            test)    payload="{\"mode\":\"test\",\"testTo\":\"${TEST_TO}\"}" ;;
            send)    payload="{\"mode\":\"send\",\"confirm\":\"${CONFIRM}\"}" ;;
            *)
              echo "::error::MODE resolved to '${MODE}', which is not dry-run, test or send. Refusing to guess."
              exit 1
              ;;
          esac

          echo "event=${{ github.event_name }}  resolved mode=${MODE}"
          echo "POST ${SITE_URL}/api/cron/roles-roundup"

          # -o/-w rather than --fail: we want the BODY on a failure, because the
          # route returns the per-recipient failed[] list alongside the 500.
          status=$(curl -sS -X POST "${SITE_URL}/api/cron/roles-roundup" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d "$payload" \
            -o response.json -w '%{http_code}')

          echo "HTTP ${status}"
          python3 -m json.tool response.json || cat response.json

          # A failed send must fail the RUN. This is the whole point of moving
          # the trigger here: the route now returns 500 when any send fails, and
          # Actions turns that into a red run and a notification email. A green
          # tick must mean the emails actually went.
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Roundup returned HTTP ${status} — see the response body above."
            exit 1
          fi

          sent=$(python3 -c "import json;print(json.load(open('response.json')).get('sent',0))")
          echo "::notice::Roundup ${MODE} completed — sent=${sent}"
