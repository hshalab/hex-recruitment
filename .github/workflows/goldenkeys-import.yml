name: Goldenkeys scheduled import

# Fortnightly re-scrape of Goldenkeys hospitality vacancies: imports new roles,
# updates existing in place, and reconciles gone roles to `filled`. Keeps the
# public job board AND the /feed/jobs.xml aggregator feed fresh with no manual run.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   FIRECRAWL_API_KEY, NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   SITE_URL, CRON_SECRET  <- needed so newly-imported roles get their area
#                             resolved; without them the run still works but
#                             warns, and new roles match every candidate's area.

# SCHEDULE TEMPORARILY REMOVED — 27 Jul 2026. Manual runs still work.
#
# The importer inserts rows with no company_banner_url and no company_logo_url,
# so every run puts unbranded listings on the public board. Today's run added
# 16, and they were only fixed because Paul spotted them on the live site. The
# images come from a SEPARATE script (scripts/import-goldenkeys-images.mjs)
# that this workflow has never called.
#
# Left scheduled, that repeats overnight with nobody watching. The board is
# fresh as of today, so skipping a week costs nothing.
#
# TO RE-ENABLE, once the importer assigns a banner and logo at insert time,
# restore under `on:`:
#   schedule:
#     - cron: '0 6 * * 2'   # Tuesdays 06:00 UTC, two hours before the roundup
#
# That 06:00/08:00 pairing is deliberate — the roundup email
# (vercel.json: /api/cron/roles-roundup, '0 8 * * 2') must send off a board
# collected hours earlier, not days. If one moves, move both. Normal rhythm
# resumes Tue 4 Aug.

on:
  workflow_dispatch: {}    # manual "Run workflow" button in the Actions tab

concurrency:
  group: goldenkeys-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (not `npm ci`) — tolerant of the lockfile drift that only
      # strict `npm ci` rejects across npm major versions; matches how Vercel
      # builds this repo. A scraper cron doesn't need ci's exact pinning.
      - run: npm install --no-audit --no-fund
      - name: Run Goldenkeys importer (--all)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/import-goldenkeys.mjs --all
